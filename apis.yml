name: Rightrev
description: >-
  RightRev is an AI-powered revenue recognition platform that automates ASC 606
  and IFRS 15 compliant accounting for subscription, usage-based, and hybrid
  revenue models. Its API-first architecture ingests orders, invoices, and usage
  events, applies configurable Standalone Selling Price (SSP) and revenue
  policies, and produces revenue contracts, revenue and cost schedules, journal
  entries, and period-close outputs. RightRev exposes REST and GraphQL APIs
  secured with OAuth 2.0 / OpenID Connect, alongside a Salesforce-native
  application and ERP integrations for finance teams.
